name: guarda_roupa
description: "Aplicação pessoal de guarda-roupa (Android + PWA)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  camera: ^0.12.2
  crypto: ^3.0.8
  cupertino_ui: ^1.1.7
  file_saver: ^0.7.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: ^1.9.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  powersync: ^2.6.2
  sqlite3: ^3.9.1
  sqlite_async: ^0.14.8
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/fashionclip_categories.json
  # Instâncias estáticas (tool/fonts/instance_fonts.py), licença OFL.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
