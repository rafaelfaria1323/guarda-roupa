# Sync Streams do PowerSync. Publicadas pelo workflow "Supabase" depois das
# migrações (secret POWERSYNC_ADMIN_TOKEN); sem ele, colar em PowerSync
# Dashboard > Sync Streams. Cada tabela aqui tem de estar na publicação
# `powersync`, com SELECT para powersync_role, e no schema local da app
# (tool/ci/check_powersync.py).
#
# Cada utilizador recebe só as suas peças. As peças eliminadas (tombstone,
# deleted_at preenchido) saem do stream e são removidas dos dispositivos.
# O PowerSync replica sem RLS; o filtro por auth.user_id() é a autorização
# do lado da sincronização. As escritas passam por apply_garment_operation,
# apply_wear_operation, apply_outfit_operation, apply_style_operation e
# apply_plan_operation.
# Utilizações e limpezas desfeitas (voided_at) e conjuntos e inspirações
# eliminados (deleted_at) saem do stream, tal como as entradas do plano
# eliminadas.
config:
  edition: 3

streams:
  user_garments:
    auto_subscribe: true
    query: SELECT * FROM garments WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  user_wear_events:
    auto_subscribe: true
    query: SELECT * FROM wear_events WHERE owner_id = auth.user_id() AND voided_at IS NULL
  user_cleaning_events:
    auto_subscribe: true
    query: SELECT * FROM cleaning_events WHERE owner_id = auth.user_id() AND voided_at IS NULL
  user_care_policies:
    auto_subscribe: true
    query: SELECT * FROM care_policies WHERE owner_id = auth.user_id()
  user_outfits:
    auto_subscribe: true
    query: SELECT * FROM outfits WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  user_inspirations:
    auto_subscribe: true
    query: SELECT * FROM inspirations WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  user_style_preferences:
    auto_subscribe: true
    query: SELECT * FROM style_preferences WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  user_plan_entries:
    auto_subscribe: true
    query: SELECT * FROM plan_entries WHERE owner_id = auth.user_id() AND deleted_at IS NULL
