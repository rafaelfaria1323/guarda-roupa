name: Supabase

# Aplica as migrações de supabase/migrations/ ao projeto Supabase, publica
# as Edge Functions de supabase/functions/ e faz deploy das Sync Streams
# (powersync/sync-streams.yaml) na instância PowerSync.
#
# - Em PRs que mexem em migrações: só mostra o que seria aplicado (dry-run).
# - Depois de a CI passar na main: aplica (`supabase db push`). Sem migrações
#   novas não faz nada.
#
# Credencial em Settings > Secrets and variables > Actions (nunca no repo):
#   SUPABASE_DB_URL  URI do Session pooler, com a password da base
#                    (Dashboard > Connect > Session pooler).
#   SUPABASE_ACCESS_TOKEN  só para publicar as Edge Functions
#                    (Dashboard > Account > Access Tokens).
#   POWERSYNC_ADMIN_TOKEN  token pessoal do PowerSync, só para o deploy das
#                    Sync Streams (PowerSync Dashboard > Access Tokens). A
#                    instância vem do POWERSYNC_URL de config/public.json.
# As migrações ligam diretamente à base: não precisam de access token nem de
# `supabase link`. O projeto vem de config/public.json. Sem os secrets, os
# jobs avisam e não falham.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'powersync/**'
      - '.github/workflows/supabase.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nunca duas aplicações em simultâneo; nunca cancelar uma a meio.
  group: supabase-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
  POWERSYNC_CLI_VERSION: 0.10.3

jobs:
  plan:
    name: Migrações a aplicar (dry-run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL em falta: dry-run ignorado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  deploy:
    name: Aplicar migrações
    # Só depois de a CI da main passar (inclui os testes SQL), ou à mão.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # O commit que a CI validou, não um mais recente.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL em falta: migrações não aplicadas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.secrets.outputs.ok == 'true'
        name: Migrações pendentes
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - if: steps.secrets.outputs.ok == 'true'
        name: Permissões dos roles de replicação (só leitura)
        # Sem segredos no output: só nomes de roles e de tabelas.
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            select r.rolname as role,
                   coalesce(string_agg(p.tablename, ', ' order by p.tablename)
                     filter (where not has_table_privilege(r.oid,
                       format('%I.%I', p.schemaname, p.tablename), 'select')),
                     '-') as sem_select
            from pg_roles r
            cross join pg_publication_tables p
            where p.pubname = 'powersync' and r.rolreplication
              and r.rolcanlogin and not r.rolsuper
              and r.rolname not like 'supabase%'
            group by r.rolname order by r.rolname;"

  functions:
    name: Publicar Edge Functions
    # Depois das migrações (as funções usam claim_import_quota e
    # claim_due_reminders).
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN em falta: funções não publicadas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            ref=$(python3 -c "import json,urllib.parse; print(urllib.parse.urlparse(json.load(open('config/public.json'))['SUPABASE_URL']).hostname.split('.')[0])")
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.secrets.outputs.ok == 'true'
        name: Chaves VAPID dos lembretes (cria se não existirem)
        # Geradas aqui e guardadas só nos secrets das Edge Functions: nunca
        # no repositório nem no log. A pública chega à app pela função.
        env:
          REF: ${{ steps.secrets.outputs.ref }}
        run: |
          if supabase secrets list --project-ref "$REF" | grep -qw VAPID_PRIVATE_KEY; then
            echo "Chaves VAPID já existem"; exit 0
          fi
          keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
          private=$(jq -r .privateKey <<<"$keys")
          echo "::add-mask::$private"
          umask 077
          jq -r '"VAPID_PUBLIC_KEY=\(.publicKey)\nVAPID_PRIVATE_KEY=\(.privateKey)"' <<<"$keys" > vapid.env
          unset keys private
          supabase secrets set --env-file vapid.env --project-ref "$REF"
          rm vapid.env
          echo "Chaves VAPID criadas"
      - if: steps.secrets.outputs.ok == 'true'
        run: |
          for f in import-product reminders; do
            supabase functions deploy "$f" --project-ref "${{ steps.secrets.outputs.ref }}" --use-api
          done
      - if: steps.secrets.outputs.ok == 'true' && env.SUPABASE_DB_URL != ''
        name: Agendar os lembretes (pg_cron, de 5 em 5 minutos)
        # Sem segredos no comando: o token do cron fica na base
        # (private.reminder_cron) e a chave publishable é pública.
        env:
          REF: ${{ steps.secrets.outputs.ref }}
        run: |
          key=$(jq -r .SUPABASE_PUBLISHABLE_KEY config/public.json)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off \
            -v url="https://$REF.supabase.co/functions/v1/reminders" -v key="$key" <<'SQL'
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          select cron.schedule('fio-reminders', '*/5 * * * *', format(
            $c$select net.http_post(url := %L,
              body := jsonb_build_object('token', (select token from private.reminder_cron)),
              headers := jsonb_build_object('content-type', 'application/json', 'apikey', %L),
              timeout_milliseconds := 30000)$c$, :'url', :'key')) as job;
          SQL

  # Sync Streams: valida em PRs, faz deploy depois das migrações (as streams
  # leem tabelas que as migrações criam). O PowerSync só muda se o ficheiro
  # mudou: um deploy igual ao atual não faz nada.
  powersync:
    name: Sync Streams do PowerSync
    needs: deploy
    # Em PRs o deploy das migrações não corre (skipped): só dry-run aqui.
    # Na main, só se as migrações foram aplicadas.
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        run: |
          if [ -z "$PS_ADMIN_TOKEN" ]; then
            echo "::warning::Secret POWERSYNC_ADMIN_TOKEN em falta: Sync Streams não publicadas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            id=$(python3 -c "import json,urllib.parse; print(urllib.parse.urlparse(json.load(open('config/public.json'))['POWERSYNC_URL']).hostname.split('.')[0])")
            echo "instance=$id" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.secrets.outputs.ok == 'true'
        name: Deploy (dry-run em PRs)
        run: >-
          npx --yes "powersync@${POWERSYNC_CLI_VERSION}" deploy sync-config
          --instance-id "${{ steps.secrets.outputs.instance }}"
          --directory powersync
          --sync-config-file-path powersync/sync-streams.yaml
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
