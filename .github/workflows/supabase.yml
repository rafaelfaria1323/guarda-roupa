name: Supabase

# Aplica as migrações de supabase/migrations/ ao projeto Supabase.
#
# - Em PRs que mexem em migrações: só mostra o que seria aplicado (dry-run).
# - Depois de a CI passar na main: aplica (`supabase db push`). Sem migrações
#   novas não faz nada.
#
# Credencial em Settings > Secrets and variables > Actions (nunca no repo):
#   SUPABASE_DB_URL  URI do Session pooler, com a password da base
#                    (Dashboard > Connect > Session pooler).
# Liga diretamente à base: não precisa de access token nem de `supabase link`.
# Sem o secret, os jobs avisam e não falham.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nunca duas aplicações em simultâneo; nunca cancelar uma a meio.
  group: supabase-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  plan:
    name: Migrações a aplicar (dry-run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL em falta: dry-run ignorado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  deploy:
    name: Aplicar migrações
    # Só depois de a CI da main passar (inclui os testes SQL), ou à mão.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # O commit que a CI validou, não um mais recente.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL em falta: migrações não aplicadas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.secrets.outputs.ok == 'true'
        name: Migrações pendentes
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
