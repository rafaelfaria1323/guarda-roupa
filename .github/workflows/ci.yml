name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  docs:
    name: Links da documentação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/ci/check_links.py

  changes:
    name: Deteção de alterações
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      sql: ${{ steps.filter.outputs.sql }}
      matrix: ${{ steps.shards.outputs.matrix }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'pubspec.*'
              - 'l10n.yaml'
              - 'analysis_options.yaml'
              - 'tool/ci/**'
              - '.github/workflows/**'
            sql:
              - 'supabase/**'
              - 'tool/db/**'
              - '.github/workflows/**'
      - id: shards
        run: python3 tool/ci/test_shards.py

  analyze:
    name: Formatação e análise
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

  test:
    name: Testes (shard ${{ matrix.shard }}/${{ needs.changes.outputs.total }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test ${{ matrix.files }}

  sql:
    name: Testes SQL (Supabase)
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: tool/db/test_migrations.sh

  ci-ok:
    name: CI ok
    if: always()
    needs: [docs, changes, analyze, test, sql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if echo '${{ toJson(needs.*.result) }}' | grep -Eq '"(failure|cancelled)"'; then
            echo "Há jobs falhados ou cancelados."; exit 1
          fi
